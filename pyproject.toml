[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bumao-core"
version = "0.2.6"
description = "Stdlib-only rule-execution kernel: one rule set in, one deterministic verdict out."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Bumao" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Bumao-Ai/Bumao-core"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["bumao_core*"]
namespaces = false

[tool.setuptools.package-data]
bumao_core = [
    "HOST_CONTRACT.md",
    "jiancha/*.json",
    "jiancha/schema/*.json",
]
